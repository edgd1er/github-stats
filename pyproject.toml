[build-system]
# Minimum requirements for the build system
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Project metadata
name = "github-stats"
version = "1.0.0"
description = "Generate visualizations of GitHub user and repository statistics with GitHub Actions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "edgd1er"}
]
keywords = [
    "github",
    "statistics",
    "visualization",
    "profile",
    "actions"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "types-requests>=2.28.0",
    "types-aiohttp>=0.1.0",
]

# For type checking
type-checking = [
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
]

# For testing
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "respx>=0.20.0",
]

# For linting
lint = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.0.0",
]

# All development dependencies
all = [
    "github-stats[dev,test,type-checking,lint]",
]

[project.scripts]
# CLI entry points (if any)
# github-stats = "github_stats:main"

[project.urls]
Homepage = "https://github.com/jstrieb/github-stats"
Documentation = "https://github.com/jstrieb/github-stats#readme"
Repository = "https://github.com/jstrieb/github-stats.git"
Issues = "https://github.com/jstrieb/github-stats/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["github_stats*"]

[tool.black]
# Black code formatter configuration
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312", "py313", "py314"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
# isort configuration
profile = "black"
line_length = 88
known_first_party = ["github_stats"]
known_third_party = ["aiohttp", "requests"]

[tool.flake8]
# Flake8 configuration
max-line-length = 88
extend-ignore = ["E203"]  # Compatible with Black
ignore = [
    "E203",  # Whitespace before ':' (Black incompatible)
    "W503",  # Line break before binary operator (Black incompatible)
]

[tool.mypy]
# MyPy configuration
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Pytest configuration
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
testpaths = ["tests"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
# Coverage configuration
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "setup.py",
]

[tool.coverage.report]
# Coverage report configuration
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
